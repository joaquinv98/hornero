# Receta chica de billing-oss. El superusuario solo entra por el socket local, como el usuario postgres del
# contenedor. Todo lo demás entra por TLS con contraseña scram-sha-256, y nada más.
# TIPO   BASE  USUARIO   DIRECCIÓN  MÉTODO
local    all   postgres             peer
hostssl  all   all       all        scram-sha-256
