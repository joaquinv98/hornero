# UserParameter de Zabbix (agent o agent2) para billing-oss. Va en /etc/zabbix/zabbix_agent2.d/ del host al que
# se le asigna la plantilla "billing-oss negocio". Lo ejecuta el usuario zabbix con psql. La conexión sale de
# pg_service.conf y la contraseña de pgpass, los dos en /etc/zabbix/billing-oss/ con dueño zabbix y modo 0600.
# Nunca hay credenciales en este archivo. Guía: docs/observabilidad/README.md.
UserParameter=billing.metrics,PGSERVICEFILE=/etc/zabbix/billing-oss/pg_service.conf PGPASSFILE=/etc/zabbix/billing-oss/pgpass psql -XAtq -d service=billing_metrics -c "SELECT coalesce(json_agg(m), '[]') FROM platform.metrics() m"
